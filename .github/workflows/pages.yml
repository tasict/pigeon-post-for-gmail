name: Deploy site

# Publishes site/ to GitHub Pages. PRIVACY.md is copied in so the privacy page can load it from the same origin.
on:
  push:
    branches: [master]
    paths: ['site/**', 'PRIVACY.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Add the privacy policy
        run: cp PRIVACY.md site/PRIVACY.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
