<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pigeon Post for Gmail</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="bar-text">
      <strong id="summary" data-i18n="loading"></strong>
      <small id="checked"></small>
    </div>
    <button id="refresh" class="icon-btn" type="button" data-i18n-attr="title:checkNow;aria-label:checkNow">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M15.6 6.2A6.5 6.5 0 1 0 16.5 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 2.8v3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="settings" class="icon-btn" type="button" data-i18n-attr="title:settings;aria-label:settings">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h14M3 14.5h14"/><circle class="knob knob-a" cx="13" cy="5.5" r="2"/><circle class="knob knob-b" cx="7" cy="14.5" r="2"/></svg>
    </button>
  </header>
  <nav id="strip" class="strip" data-i18n-attr="aria-label:stripLabel" hidden></nav>
  <p id="warning" class="warning" hidden></p>
  <main id="content"></main>
  <script src="i18n.js"></script>
  <script src="feed-parser.js"></script>
  <script src="gmail.js"></script>
  <script src="settings.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
